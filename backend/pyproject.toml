[project]
name = "ai-intelligence-station"
version = "0.1.0"
description = "AI资讯聚合与推送Web应用，聚焦AI前沿、游戏制作工作流、使用技巧"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "apscheduler>=3.10.4",
    "sqlalchemy>=2.0.31",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
